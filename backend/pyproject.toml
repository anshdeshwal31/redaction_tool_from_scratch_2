[project]
name = "mlredact"
version = "0.1.0"
description = "Local, deterministic PII redaction for Australian medico-legal PDFs"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=2.1,<3",
    "pillow>=11,<13",
    "pypdfium2>=5.13,<6",
    "pikepdf>=10.16,<11",
    "pydantic>=2.9,<3",
    "pyyaml>=6,<7",
    "opencv-python-headless>=4.10,<5",
    "onnxruntime>=1.30,<2",
    "rapidocr>=3.9.2,<4",
    "typer>=0.12,<1",
    "cryptography>=43",
    "rapidfuzz>=3.9,<4",
    "tokenizers>=0.22,<0.23",
    "zxing-cpp>=3.1,<4",
]

[project.scripts]
mlredact = "mlredact.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6",
    "jsonschema>=4.25,<5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlredact"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "T20", "S"]
ignore = [
    "SIM905", # multi-line word lists read better as "...".split()
    "S101",   # assert is used in tests and for internal invariants
    "S311",   # we never use `random` for security; surrogates use HMAC-DRBG
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode chars appear legitimately in OCR confusion tables
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["mlredact"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "rapidocr.*", "cv2.*", "pikepdf.*", "rapidfuzz.*", "onnxruntime.*", "tokenizers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: end-to-end tests that load OCR models",
    "models: requires downloaded model artifacts (see `mlredact models fetch`)",
]
